events {
    worker_connections 1024;
}

http {
    # Define MIME types and default settings
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" to: $upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream pool of Papido backend instances
    upstream papido_backend {
        # ip_hash ensures sticky sessions for Socket.IO polling fallback
        ip_hash;
        server backend:5000;
        keepalive 32;
    }

    # HTTP server block: handles REST APIs and WebSocket traffic
    server {
        listen 80;
        listen 5000; # Also listen on 5000 so existing clients can connect without URL changes
        server_name localhost;

        # Max body size for KYC document/image uploads
        client_max_body_size 25M;

        location / {
            proxy_pass http://papido_backend;
            proxy_http_version 1.1;

            # Essential headers for WebSockets (Socket.IO upgrade)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Real client IP forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts for persistent real-time socket connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;

            # Disable proxy buffering for low-latency streaming
            proxy_buffering off;
        }

        # Health check endpoint for external monitors (UptimeRobot, etc.)
        location /health {
            proxy_pass http://papido_backend/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
