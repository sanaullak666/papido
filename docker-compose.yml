version: '3.8'

services:
  # MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: papido_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: papido_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - papido_network

  # Backend REST & Socket.IO API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: papido_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=papido_db
      - JWT_SECRET=papido_super_secure_jwt_secret_key_2026_production_ready_xyz987
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mysql_db
    networks:
      - papido_network

  # Admin Web Dashboard
  admin_web:
    build:
      context: ./apps/admin_web
      dockerfile: Dockerfile
    container_name: papido_admin_web
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - papido_network

volumes:
  mysql_data:

networks:
  papido_network:
    driver: bridge
