<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F59E0B" />

    <!-- Primary SEO Meta Tags -->
    <title>Papido – Campus Ride Booking Platform</title>
    <meta name="description" content="Papido is a campus ride booking platform providing convenient and reliable transportation around Pondicherry University." />
    <meta name="keywords" content="Papido, campus ride booking platform, Pondicherry University, Papido PU, ride booking Pondicherry, bike taxi PU" />
    <meta name="author" content="Papido" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.papido.online/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.papido.online/" />
    <meta property="og:title" content="Papido – Campus Ride Booking Platform" />
    <meta property="og:description" content="Papido is a campus ride booking platform providing convenient and reliable transportation around Pondicherry University." />
    <meta property="og:image" content="https://www.papido.online/papidologo.jpeg" />
    <meta property="og:site_name" content="Papido" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.papido.online/" />
    <meta name="twitter:title" content="Papido – Campus Ride Booking Platform" />
    <meta name="twitter:description" content="Papido is a campus ride booking platform providing convenient and reliable transportation around Pondicherry University." />
    <meta name="twitter:image" content="https://www.papido.online/papidologo.jpeg" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Papido",
      "url": "https://www.papido.online/"
    }
    </script>

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/jpeg" href="/papidologo.jpeg" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F59E0B'><circle cx='12' cy='12' r='10'/><path d='M8 12l2.5 2.5L16 9' fill='none' stroke='white' stroke-width='2'/></svg>" />
    <link rel="apple-touch-icon" href="/papidologo.jpeg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: Inter, Outfit, Plus Jakarta Sans, Manrope & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet">
    <!-- Leaflet CSS for Map integration -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[PWA] Service Worker registered:', reg.scope);
          }).catch((err) => {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
